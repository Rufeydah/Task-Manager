<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QUESTLY — Your Daily Adventure</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#252640;background:#f7f6f3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b9a8f5} .app{max-width:1120px;margin:auto;padding:24px 24px 110px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.logo{font-size:22px;font-weight:900;letter-spacing:1px;color:#161c35}.logo span{color:#7765e3}.topright{display:flex;align-items:center;gap:12px}.pill{border-radius:30px;padding:9px 14px;background:white;font-weight:700;font-size:13px}.avatar{background:#e6e0ff;color:#6756cf;border-radius:50%;width:43px;height:43px;display:grid;place-items:center;font-weight:800}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:#7765e3;text-transform:uppercase}.heading{font-size:36px;letter-spacing:-1.4px;margin:8px 0}.muted{color:#88899d}.card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 36px #1e1d3a0b}.hero{background:linear-gradient(120deg,#262c51,#171d38);color:white;display:flex;align-items:center;justify-content:space-between;min-height:235px;overflow:hidden}.hero h2{font-size:25px;margin:8px 0}.hero p{color:#d4d0ee;font-size:14px;line-height:1.6}.ring{width:146px;height:146px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:conic-gradient(#c2b4ff var(--progress),#414563 0);position:relative}.ring:before{content:"";position:absolute;inset:15px;border-radius:50%;background:#232945}.ring strong{z-index:1;font-size:30px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px}.sectionhead h2{font-size:19px;margin:0}.link{background:none;border:0;color:#7765e3;font-weight:700}.task{display:flex;align-items:center;gap:13px;border:1px solid #f0eef5;border-radius:16px;padding:14px;margin-bottom:10px;transition:.2s}.task:hover{border-color:#c9bef9}.task.done{opacity:.62}.task.done .tasktitle{text-decoration:line-through}.check{width:24px;height:24px;border:2px solid #c7bdf5;border-radius:8px;background:white;color:white;flex-shrink:0}.done .check{background:#65bfa5;border-color:#65bfa5}.taskbody{flex:1;min-width:0}.tasktitle{font-weight:750;font-size:14px}.taskmeta{font-size:12px;color:#9291a3;margin-top:5px}.xp{font-size:12px;color:#9a7b36;background:#fff6e3;border-radius:20px;padding:6px 10px;font-weight:800}.tiny{border:0;background:#f6f5fb;color:#77738c;border-radius:10px;padding:7px 10px}.primary{border:0;background:#7765e3;color:white;padding:13px 19px;border-radius:13px;font-weight:750;box-shadow:0 7px 16px #7765e330}.secondary{border:0;background:#eeebfc;color:#6756cf;padding:12px 16px;border-radius:12px;font-weight:750}.full{width:100%}.side{display:flex;flex-direction:column;gap:18px}.level{background:#f0edff;border-radius:24px;padding:24px}.leveltop{display:flex;align-items:center;justify-content:space-between}.level h3{margin:7px 0}.progress{height:10px;background:#ded8fa;border-radius:20px;overflow:hidden;margin:16px 0 8px}.progress i{display:block;height:100%;background:#7765e3;border-radius:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{text-align:center;background:white;border-radius:16px;padding:15px 8px}.stat strong{font-size:22px;display:block;color:#292d4b}.stat small{color:#8c8b9e;font-size:11px}.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#161c35;border-radius:20px;display:flex;gap:5px;padding:8px;box-shadow:0 12px 35px #161c3540;z-index:5}.nav button{background:transparent;border:0;color:#aaaac5;padding:11px 19px;border-radius:13px;font-size:13px;font-weight:700;white-space:nowrap}.nav button.active{background:#7765e3;color:white}.hidden{display:none!important}.journey{background:linear-gradient(160deg,#1b2243,#34315b);border-radius:26px;padding:27px;color:white}.journey h2{margin:0 0 8px}.path{display:flex;flex-direction:column;align-items:center;padding:10px 0}.node{width:100%;display:flex;align-items:center;gap:16px;max-width:520px;padding:12px}.node:nth-child(even){flex-direction:row-reverse;text-align:right}.orb{height:70px;width:70px;display:grid;place-items:center;background:#49496d;border:3px solid #777797;border-radius:50%;font-size:28px;flex-shrink:0}.node.unlocked .orb{background:linear-gradient(135deg,#e5c47b,#b58a43);border-color:#f9e5b3;box-shadow:0 0 24px #d8b46a70}.node .nodetext{flex:1}.node small{color:#bbb9d3}.connector{height:24px;border-left:3px dashed #777797}.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.badgecard{background:#f7f5ff;border-radius:15px;text-align:center;padding:16px 7px;font-size:12px}.badgecard b{display:block;font-size:26px;margin-bottom:6px}.badgecard.locked{filter:grayscale(1);opacity:.45}.timer{font-size:76px;font-weight:800;letter-spacing:-3px;text-align:center;margin:22px 0}.timercontrols{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.timercontrols button{min-width:70px}.formgrid{display:grid;gap:12px}.formgrid input,.formgrid select{width:100%;padding:13px;border:1px solid #e7e3f1;border-radius:12px;background:white}.modalwrap{position:fixed;inset:0;background:#161c3590;display:grid;place-items:center;z-index:10;padding:20px}.modal{background:white;border-radius:24px;padding:25px;width:min(440px,100%)}.modal h2{margin-top:0}.modalactions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#252a4d;color:white;padding:13px 22px;border-radius:16px;z-index:30;box-shadow:0 10px 30px #0002}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{padding:12px 4px;background:#f1effb;border-radius:12px;text-align:center;font-size:12px}.day strong{display:block;margin-top:8px}.day.current{background:#7765e3;color:white}.settings{display:flex;gap:12px;flex-wrap:wrap}.dark{background:#12182d;color:#eeeefa}.dark .card,.dark .pill,.dark .stat,.dark .modal{background:#242b45;color:#f5f4ff}.dark .task{border-color:#3a3c58}.dark .task .check{background:transparent}.dark .task.done .check{background:#65bfa5}.dark .level,.dark .day,.dark .badgecard{background:#303252}.dark .logo{color:white}.dark .muted{color:#aaaac2}body:has(.dark){background:#12182d} [dir=rtl] .heading{letter-spacing:0}@media(max-width:750px){.app{padding:19px 15px 100px}.grid{grid-template-columns:1fr}.heading{font-size:29px}.hero{min-height:200px;padding:20px}.ring{width:116px;height:116px}.ring:before{inset:12px}.hero h2{font-size:20px}.nav{bottom:8px;width:calc(100% - 16px);justify-content:space-between}.nav button{padding:12px 8px;font-size:11px;flex:1}.badges{grid-template-columns:repeat(2,1fr)}.timer{font-size:58px}}
</style></head><body><div id="root"></div><script>
const KEY='questly-v1';const dateKey=()=>new Date().toLocaleDateString('en-CA');const seed=[{id:1,title:'Plan the week ahead',category:'Work',difficulty:'medium',done:false,date:dateKey()},{id:2,title:'Read for 20 minutes',category:'Learning',difficulty:'easy',done:false,date:dateKey()},{id:3,title:'Finish your main project task',category:'Work',difficulty:'hard',done:false,date:dateKey()},{id:4,title:'Go for a short walk',category:'Health',difficulty:'easy',done:false,date:dateKey()}];let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}state=state||{tasks:seed,focus:0,lang:'en',dark:false,bonusDates:[]};let tab='today',modal=false,editing=null,seconds=25*60,interval=null,activeTimer=false,duration=25;const xpMap={easy:10,medium:25,hard:50};const t=(en,ar)=>state.lang==='ar'?ar:en;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const earned=()=>state.tasks.filter(x=>x.done).reduce((n,x)=>n+xpMap[x.difficulty],0)+state.focus*25+state.bonusDates.length*100;const lvl=()=>Math.floor(earned()/150)+1;const allDone=()=>state.tasks.filter(x=>x.date===dateKey()).every(x=>x.done)&&state.tasks.some(x=>x.date===dateKey());const doneDates=()=>[...new Set(state.tasks.filter(x=>x.done).map(x=>x.date))];const streak=()=>{let d=new Date(),n=0,dates=doneDates();if(!dates.includes(dateKey()))d.setDate(d.getDate()-1);while(dates.includes(d.toLocaleDateString('en-CA'))){n++;d.setDate(d.getDate()-1)}return n};const badges=()=>[{icon:'✦',name:t('First Quest','أول مهمة'),ok:state.tasks.some(x=>x.done)},{icon:'☀️',name:t('Early Bird','الطائر المبكر'),ok:state.tasks.some(x=>x.done&&x.completedHour<12)},{icon:'🎯',name:t('Focus Champion','بطل التركيز'),ok:state.focus>=5},{icon:'🔥',name:t('Consistency Hero','بطل الاستمرارية'),ok:streak()>=7},{icon:'🏆',name:t('Quest Master','سيد المهام'),ok:state.tasks.filter(x=>x.done).length>=100},{icon:'👑',name:t('Legendary','الأسطورة'),ok:lvl()>=10}];function toast(msg){document.querySelector('.toast')?.remove();let el=document.createElement('div');el.className='toast';el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}function toggle(id){let a=state.tasks.find(x=>x.id===id);a.done=!a.done;a.completedHour=a.done?new Date().getHours():null;if(allDone()&&!state.bonusDates.includes(dateKey())){state.bonusDates.push(dateKey());toast(t('Perfect day! +100 bonus XP ✨','يوم مثالي! +١٠٠ نقطة ✨'))}else if(a.done)toast('+'+xpMap[a.difficulty]+' XP ✨');save();render()}function removeTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);save();render()}function openTask(id){editing=id||null;modal=true;render()}function submitTask(e){e.preventDefault();let f=new FormData(e.target),obj={title:String(f.get('title')).trim(),category:f.get('category'),difficulty:f.get('difficulty'),date:f.get('date')||dateKey()};if(!obj.title)return;if(editing){Object.assign(state.tasks.find(x=>x.id===editing),obj)}else state.tasks.push({...obj,id:Date.now(),done:false});modal=false;save();render()}function setTab(v){tab=v;render()}function setDuration(v){clearInterval(interval);activeTimer=false;duration=v;seconds=v*60;render()}function timerToggle(){if(activeTimer){clearInterval(interval);activeTimer=false}else{activeTimer=true;interval=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(interval);activeTimer=false;seconds=duration*60;state.focus++;save();toast(t('Boss defeated! +25 XP 🎉','أنجزت تحدي التركيز! +٢٥ نقطة 🎉'))}render()},1000)}render()}function formatTime(){return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}function render(){document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';const tasks=state.tasks.filter(x=>x.date===dateKey()),done=tasks.filter(x=>x.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0,xp=earned(),level=lvl();let app=document.getElementById('root');app.className='app'+(state.dark?' dark':'');let html=`<header class="top"><div class="logo">✦ QUEST<span>LY</span></div><div class="topright"><div class="pill">🔥 ${streak()} ${t('day streak','يوم متواصل')}</div><div class="avatar">Q</div></div></header>`;
if(tab==='today')html+=`<div class="grid"><main><div class="eyebrow">${t('YOUR DAILY ADVENTURE','مغامرتك اليومية')}</div><h1 class="heading">${t('Make today count ✨','خلي اليوم يستحق ✨')}</h1><p class="muted">${new Date().toLocaleDateString(state.lang==='ar'?'ar-SA':'en-US',{weekday:'long',month:'long',day:'numeric'})} · ${t('Small steps, big victories.','خطوات صغيرة، إنجازات كبيرة.')}</p><div class="card hero"><div><div class="eyebrow" style="color:#c5b8ff">${t('TODAY’S PROGRESS','تقدم اليوم')}</div><h2>${done} / ${tasks.length} ${t('quests completed','مهام مكتملة')}</h2><p>${pct===100?t('You conquered today!','أنجزت كل مهام اليوم!'):t('Every quest brings you closer.','كل مهمة تقربك من هدفك.')}</p></div><div class="ring" style="--progress:${pct}%"><strong>${pct}%</strong></div></div><div class="sectionhead"><h2>${t('Today’s Quests','مهام اليوم')}</h2><button class="link" onclick="openTask()">+ ${t('Add quest','إضافة مهمة')}</button></div><div class="card">${tasks.length?tasks.map(x=>taskHTML(x)).join(''):`<p class="muted">${t('No quests yet. Add your first one!','ما عندك مهام اليوم. أضيفي أول مهمة!')}</p>`}<button class="secondary full" onclick="openTask()">+ ${t('New quest','مهمة جديدة')}</button></div></main><aside class="side"><div class="level"><div class="leveltop"><div><div class="eyebrow">${t('YOUR HERO LEVEL','مستوى البطلة')}</div><h3>⭐ ${t('Level','المستوى')} ${level}</h3></div><span style="font-size:38px">🪄</span></div><div class="progress"><i style="width:${xp%150/150*100}%"></i></div><small>${xp%150} / 150 XP ${t('to next level','للمستوى التالي')}</small></div><div class="stats"><div class="stat"><strong>${xp}</strong><small>XP</small></div><div class="stat"><strong>${state.tasks.filter(x=>x.done).length}</strong><small>${t('Completed','مكتملة')}</small></div><div class="stat"><strong>${badges().filter(x=>x.ok).length}</strong><small>${t('Badges','شارات')}</small></div></div><div class="card"><div class="eyebrow">${t('THE JOURNEY','رحلة الإنجازات')}</div><h3>${t('Your story is unfolding','قصتك تتقدم كل يوم')}</h3><p class="muted">${t('Unlock milestones and collect beautiful badges as you grow.','افتحي مراحل جديدة واجمعي شارات مع كل إنجاز.')}</p><button class="primary full" onclick="setTab('journey')">${t('Explore your journey →','استكشفي رحلتك ←')}</button></div><div class="card"><h3>🎯 ${t('Focus challenge','تحدي التركيز')}</h3><p class="muted">${t('Beat a focus session and earn XP.','أنجزي جلسة تركيز واكسبي نقاط.')}</p><button class="secondary full" onclick="setTab('focus')">${t('Start Boss Battle','ابدئي التحدي')}</button></div></aside></div>`;
if(tab==='quests')html+=`<div class="eyebrow">${t('QUEST LOG','سجل المهام')}</div><h1 class="heading">${t('All your quests','جميع مهامك')}</h1><div class="card"><div class="sectionhead" style="margin-top:0"><h2>${state.tasks.length} ${t('quests','مهمة')}</h2><button class="primary" onclick="openTask()">+ ${t('New quest','مهمة جديدة')}</button></div>${state.tasks.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>taskHTML(x,true)).join('')}</div><div class="card" style="margin-top:18px"><h3>${t('This week','هذا الأسبوع')}</h3><div class="week">${Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()+i);return `<div class="day ${i===0?'current':''}">${d.toLocaleDateString(state.lang==='ar'?'ar-SA':'en-US',{weekday:'short'})}<strong>${d.getDate()}</strong></div>`}).join('')}</div></div>`;
if(tab==='focus')html+=`<div class="eyebrow">${t('FOCUS MODE','وضع التركيز')}</div><h1 class="heading">⚔️ ${t('Boss Battle','تحدي التركيز')}</h1><div class="card" style="max-width:620px;margin:auto;text-align:center;padding:38px"><div style="font-size:58px">🛡️</div><h2>${t('Defeat distractions','تغلبي على المشتتات')}</h2><p class="muted">${t('Finish a session to earn 25 XP.','أكملي جلسة واكسبي ٢٥ نقطة.')}</p><div class="timer">${formatTime()}</div><div class="timercontrols">${[15,25,45,60].map(v=>`<button class="${duration===v?'primary':'secondary'}" onclick="setDuration(${v})">${v}m</button>`).join('')}</div><div class="timercontrols" style="margin-top:26px"><button class="primary" onclick="timerToggle()">${activeTimer?t('Pause','إيقاف مؤقت'):t('Start / Resume','بدء / متابعة')}</button><button class="secondary" onclick="setDuration(${duration})">${t('Reset','إعادة')}</button></div><p class="muted">${state.focus} ${t('sessions completed','جلسات مكتملة')}</p></div>`;
if(tab==='journey')html+=`<div class="eyebrow">${t('YOUR PERSONAL ADVENTURE','مغامرتك الشخصية')}</div><h1 class="heading">${t('Journey of Achievements','رحلة الإنجازات')} ✨</h1><p class="muted">${t('Every small victory becomes part of your story.','كل إنجاز صغير يصير جزء من قصتك.')}</p><div class="grid"><div class="journey"><h2>✦ ${t('The path to legendary','الطريق إلى الأسطورة')}</h2><p style="color:#c4c1dc">${t('Earn XP to unlock the next chapter.','اجمعي النقاط لفتح الفصل التالي.')}</p><div class="path">${[{n:1,e:'🌱',en:'Beginner Explorer',ar:'بداية الرحلة'},{n:2,e:'✨',en:'Rising Adventurer',ar:'المغامرة الصاعدة'},{n:3,e:'⚔️',en:'Focus Warrior',ar:'محاربة التركيز'},{n:5,e:'🏆',en:'Productivity Master',ar:'سيدة الإنجاز'},{n:10,e:'👑',en:'Legendary Achiever',ar:'الإنجاز الأسطوري'}].map((x,i)=>`${i?'<div class="connector"></div>':''}<div class="node ${level>=x.n?'unlocked':''}"><div class="orb">${x.e}</div><div class="nodetext"><strong>${t('Level','المستوى')} ${x.n} · ${t(x.en,x.ar)}</strong><br><small>${level>=x.n?t('Unlocked','تم الفتح'):t('Locked — keep going','مقفلة — واصلي رحلتك')}</small></div></div>`).join('')}</div></div><div class="side"><div class="level"><div class="eyebrow">${t('CURRENT CHAPTER','الفصل الحالي')}</div><h2>${t('Level','المستوى')} ${level}</h2><div class="progress"><i style="width:${xp%150/150*100}%"></i></div><small>${xp} XP ${t('total earned','إجمالي النقاط')}</small></div><div class="card"><h3>🏅 ${t('Achievement Gallery','معرض الشارات')}</h3><div class="badges">${badges().map(b=>`<div class="badgecard ${b.ok?'':'locked'}"><b>${b.icon}</b>${b.name}</div>`).join('')}</div></div><div class="card"><h3>${t('Your adventure stats','إحصائيات رحلتك')}</h3><p>⚡ ${xp} XP</p><p>🔥 ${streak()} ${t('day streak','يوم متواصل')}</p><p>🎯 ${state.focus} ${t('focus sessions','جلسات تركيز')}</p><p>✅ ${state.tasks.filter(x=>x.done).length} ${t('completed quests','مهام مكتملة')}</p></div></div></div>`;
if(tab==='profile')html+=`<div class="eyebrow">${t('PERSONAL SPACE','مساحتك الشخصية')}</div><h1 class="heading">${t('Profile & Settings','الملف والإعدادات')}</h1><div class="card" style="max-width:700px"><h2>🪄 ${t('Your Questly profile','ملفك في كويستلي')}</h2><p>${t('Level','المستوى')} ${level} · ${xp} XP</p><h3>${t('Preferences','التفضيلات')}</h3><div class="settings"><button class="secondary" onclick="state.lang=state.lang==='en'?'ar':'en';save();render()">🌐 ${t('العربية','English')}</button><button class="secondary" onclick="state.dark=!state.dark;save();render()">${state.dark?'☀️ '+t('Light mode','الوضع الفاتح'):'🌙 '+t('Dark mode','الوضع الداكن')}</button></div><p class="muted">${t('Your progress is saved locally in this browser.','تُحفظ بياناتك محلياً في هذا المتصفح.')}</p></div>`;
html+=`<nav class="nav">${[['today','⌂',t('Today','اليوم')],['quests','☷',t('Quests','المهام')],['focus','◎',t('Focus','التركيز')],['journey','✦',t('Journey','الرحلة')],['profile','◉',t('Profile','حسابي')]].map(([v,ic,label])=>`<button class="${tab===v?'active':''}" onclick="setTab('${v}')">${ic} ${label}</button>`).join('')}</nav>`;
if(modal){let x=state.tasks.find(y=>y.id===editing)||{};html+=`<div class="modalwrap" onclick="if(event.target===this){modal=false;render()}"><div class="modal"><h2>${editing?t('Edit quest','تعديل المهمة'):t('Create a new quest','إضافة مهمة جديدة')}</h2><form onsubmit="submitTask(event)" class="formgrid"><input name="title" required maxlength="130" placeholder="${t('What do you want to accomplish?','ماذا تريدين إنجازه؟')}" value="${esc(x.title||'')}"><select name="category">${['Work','Study','Health','Personal','Learning','Home'].map(v=>`<option ${x.category===v?'selected':''}>${v}</option>`).join('')}</select><select name="difficulty">${[['easy',t('Easy · 10 XP','سهلة · ١٠ نقاط')],['medium',t('Medium · 25 XP','متوسطة · ٢٥ نقطة')],['hard',t('Hard · 50 XP','صعبة · ٥٠ نقطة')]].map(([v,label])=>`<option value="${v}" ${x.difficulty===v?'selected':''}>${label}</option>`).join('')}</select><input type="date" name="date" value="${x.date||dateKey()}"><div class="modalactions"><button type="button" class="secondary" onclick="modal=false;render()">${t('Cancel','إلغاء')}</button><button class="primary" type="submit">${t('Save quest','حفظ المهمة')}</button></div></form></div></div>`}app.innerHTML=html}function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}function taskHTML(x,withDate=false){return `<div class="task ${x.done?'done':''}"><button class="check" aria-label="Toggle completion" onclick="toggle(${x.id})">${x.done?'✓':''}</button><div class="taskbody"><div class="tasktitle">${esc(x.title)}</div><div class="taskmeta">${x.category} · ${t(x.difficulty,x.difficulty==='easy'?'سهلة':x.difficulty==='medium'?'متوسطة':'صعبة')}${withDate?' · '+x.date:''}</div></div><span class="xp">+${xpMap[x.difficulty]} XP</span><button class="tiny" aria-label="Edit task" onclick="openTask(${x.id})">✎</button><button class="tiny" aria-label="Delete task" onclick="if(confirm('${t('Delete this quest?','حذف هذه المهمة؟')}'))removeTask(${x.id})">×</button></div>`}render();
</script></body></html>
